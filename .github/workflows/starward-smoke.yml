name: Starward Run Smoke Test

on:
  push:
    paths:
      - 'pocket-starwing/**'
      - '.github/workflows/starward-smoke.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime and harness syntax check
        run: |
          node --check pocket-starwing/game-v9-loader.js
          node --check pocket-starwing/v10-polish3.js
          node --check pocket-starwing/v10-polish4.js
          node --check pocket-starwing/v10-polish5.js
          node --check pocket-starwing/v10-polish6.js
          node --check pocket-starwing/v10-polish7.js
          node --check pocket-starwing/v10-polish8.js
          node --check pocket-starwing/v10-polish9.js
          node --check pocket-starwing/v12-aim-controls.js
          node --check pocket-starwing/v13-engagement.js
          node --check pocket-starwing/v14-ui-fairness.js
          node --check pocket-starwing/v15-final-controls.js
          node --check pocket-starwing/v16-power-state.js
          node --check pocket-starwing/v17-flow-choice.js
          node --check pocket-starwing/v18-mechanics.js
          node --check pocket-starwing/smoke-test.cjs
          node --check pocket-starwing/smoke-v105.cjs
          node --check pocket-starwing/smoke-v106.cjs
          node --check pocket-starwing/smoke-v107.cjs
          node --check pocket-starwing/smoke-v110.cjs
          node --check pocket-starwing/smoke-v111.cjs
          node --check pocket-starwing/smoke-v12.cjs
          node --check pocket-starwing/smoke-v16.cjs
          node --check pocket-starwing/smoke-v17.cjs
          node --check pocket-starwing/smoke-v18.cjs
          node --check pocket-starwing/sim-v17.cjs

  synthetic-play-model:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare baseline and V17 across thousands of synthetic play-hours
        run: node pocket-starwing/sim-v17.cjs

  stress:
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [123456789, 987654321, 42424242]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate full V10.10 runtime seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-test.cjs
      - name: Simulate V10.5 tactical polish seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v105.cjs
      - name: Simulate V10.6 input and subsystem UX seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v106.cjs
      - name: Simulate V10.7 tactical clarity seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v107.cjs
      - name: Simulate V10.10 precision targeting seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v110.cjs
      - name: Simulate V10.11 mastery polish seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v111.cjs
      - name: Simulate V12 manual-aim foundation seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v12.cjs
      - name: Simulate V16 final engagement runtime seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v16.cjs
      - name: Simulate V17 flow and combat-choice runtime seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v17.cjs
      - name: Simulate V18 expressive-control runtime seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v18.cjs
