name: Starward Run Smoke Test

on:
  push:
    paths:
      - 'pocket-starwing/**'
      - '.github/workflows/starward-smoke.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Loader syntax check
        run: |
          node --check pocket-starwing/game-v9-loader.js
          node --check pocket-starwing/v10-polish3.js
          node --check pocket-starwing/smoke-v105.cjs

  stress:
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [123456789, 987654321, 42424242]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate V10.4 combat seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-test.cjs
      - name: Simulate V10.5 tactical polish seed ${{ matrix.seed }}
        env:
          STARWARD_SEED: ${{ matrix.seed }}
        run: node pocket-starwing/smoke-v105.cjs
