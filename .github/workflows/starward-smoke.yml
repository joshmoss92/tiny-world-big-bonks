name: Starward Run Smoke Test

on:
  push:
    paths:
      - 'pocket-starwing/**'
      - '.github/workflows/starward-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Loader syntax check
        run: node --check pocket-starwing/game-v9-loader.js
      - name: Reconstruct and simulate V9 runtime
        run: node pocket-starwing/smoke-test.cjs
