<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tiny World, Big Bonks</title><style>*{box-sizing:border-box;touch-action:none}html,body{margin:0;background:#f7f0f4;font-family:system-ui;color:#29323b;overflow:hidden}#g{display:block;width:100vw;height:100vh;background:#cfe8ad}.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:6px;z-index:4;pointer-events:none}.p{background:#fffffff0;border:1px solid #d8d0d5;border-radius:12px;padding:7px 9px;font-weight:800;font-size:12px}.start{position:fixed;inset:0;background:#26303aa8;display:grid;place-items:center;z-index:10;padding:20px}.card{background:white;border-radius:22px;padding:24px;max-width:340px;text-align:center;box-shadow:0 15px 50px #0003}.card h1{margin:5px 0;font-size:27px}.card p{color:#6d7480;line-height:1.45}.play{border:0;background:#efc6da;border-radius:15px;padding:15px;width:100%;font-size:17px;font-weight:900;color:#29323b}.hide{display:none}.pad{position:fixed;left:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:145px;height:145px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff99;z-index:5}.nub{position:absolute;left:47px;top:47px;width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid #bbb}.atk{position:fixed;right:25px;bottom:calc(30px + env(safe-area-inset-bottom));width:105px;height:105px;border-radius:50%;border:2px solid #fff9;background:#efbdd5;font-size:38px;z-index:5}.toast{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#fffffff2;border-radius:11px;padding:8px 12px;font-weight:800;font-size:12px;z-index:6;opacity:0;transition:.2s;white-space:nowrap}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="p">❤️ <span id="hp">38</span></div><div class="p">⭐ Lv.<span id="lv">1</span></div><div class="p">⚔️ <span id="wp">Twig Sword</span></div><div class="p">🧭 <span id="ds">0</span></div></div><div class="toast" id="toast"></div><div class="pad" id="pad"><div class="nub" id="nub"></div></div><button class="atk" id="atk">⚔️</button><div class="start" id="start"><div class="card"><div style="font-size:44px">🌸⚔️🧭</div><h1>Tiny World, Big Bonks</h1><p>Explore an endless kawaii world, discover magical places and bonk cute monsters.</p><button class="play" id="play">Begin expedition</button></div></div><script>(function(){var c=document.getElementById('g'),x=c.getContext('2d'),D=window.devicePixelRatio||1,w,h,p,m=[],fx=[],mobs=[],run=0,disc=0,lv=1,hp=38,wp='Twig Sword',cd=0,last=performance.now(),started=false;function size(){w=innerWidth;h=innerHeight;c.width=w*D;c.height=h*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function hash(a,b){var n=Math.sin(a*12.9898+b*78.233)*43758.5453;return n-Math.floor(n)}function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},900)}function spawn(){var a=Math.random()*6.28,d=280+Math.random()*300;mobs.push({x:Math.cos(a)*d+p.x,y:Math.sin(a)*d+p.y,h:12+lv*2,t:Math.random()<.3?'pink':Math.random()<.5?'bee':'slime',ph:Math.random()*6.2})}function reset(){p={x:0,y:0,vx:0,vy:0,dir:0};mobs=[];fx=[];disc=0;lv=1;hp=38;wp='Twig Sword';run=0;for(var i=0;i<8;i++)spawn();hud()}function hud(){document.getElementById('hp').textContent=Math.ceil(hp);document.getElementById('lv').textContent=lv;document.getElementById('wp').textContent=wp;document.getElementById('ds').textContent=disc}function attack(){if(!started||cd>0)return;cd=.34;var best=null,bd=75;for(var i=0;i<mobs.length;i++){var q=mobs[i],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<bd){bd=d;best=q}}fx.push({x:p.x,y:p.y,a:p.dir,t:.16});if(best){best.h-=8+lv*1.4;if(best.h<=0){disc++;if(disc%5===0){lv++;hp=Math.min(38+lv*5,hp+12);toast('⭐ Level '+lv)}mobs.splice(mobs.indexOf(best),1);spawn();if(Math.random()<.16){wp=Math.random()<.12?'Sakura Blade':Math.random()<.4?'Pink Spear':'Iron Sword';toast('✨ '+wp)}hud()}}}var pad=document.getElementById('pad'),nub=document.getElementById('nub'),pid=null,ox=72,oy=72;function pm(e){if(e.pointerId!==pid)return;var r=pad.getBoundingClientRect(),dx=e.clientX-r.left-ox,dy=e.clientY-r.top-oy,d=Math.hypot(dx,dy)||1,s=Math.min(48,d);p.vx=dx/d*s/48;p.vy=dy/d*s/48;nub.style.left=(47+dx/d*s)+'px';nub.style.top=(47+dy/d*s)+'px';if(s>5)p.dir=Math.atan2(dy,dx)}pad.onpointerdown=function(e){pid=e.pointerId;pad.setPointerCapture(pid);pm(e)};pad.onpointermove=pm;pad.onpointerup=pad.onpointercancel=function(){pid=null;p.vx=p.vy=0;nub.style.left='47px';nub.style.top='47px'};var atk=document.getElementById('atk'),hold=false;atk.onpointerdown=function(e){e.preventDefault();hold=true;attack()};atk.onpointerup=atk.onpointercancel=function(){hold=false};document.getElementById('play').onclick=function(){reset();started=true;document.getElementById('start').classList.add('hide');toast('🧭 Explore outward')};function tile(tx,ty){var r=hash(tx,ty);if(r<.035)return'water';if(r>.91)return'tree';if(r>.875)return'flower';return'grass'}function drawMob(q,sx,sy,t){var bob=Math.sin(t*5+q.ph)*2;x.fillStyle='#0002';x.beginPath();x.ellipse(sx,sy+13,13,5,0,0,6.28);x.fill();x.save();x.translate(sx,sy+bob);if(q.t==='bee'){x.fillStyle='#fff9';x.fillRect(-14,-8,8,6);x.fillRect(6,-8,8,6);x.fillStyle='#edc24e';x.fillRect(-9,-7,18,14);x.fillStyle='#51463b';x.fillRect(-3,-7,3,14)}else{x.fillStyle=q.t==='pink'?'#ef9fc1':'#75c46e';var s=1+Math.sin(t*6+q.ph)*.07;x.scale(1/s,s);x.beginPath();x.arc(0,0,14,0,6.28);x.fill();x.fillStyle='#333';x.fillRect(-6,-2,3,4);x.fillRect(4,-2,3,4)}x.restore()}function frame(now){var dt=Math.min(.033,(now-last)/1000);last=now;if(started){run+=dt;cd=Math.max(0,cd-dt);if(hold)attack();p.x+=p.vx*165*dt;p.y+=p.vy*165*dt;for(var i=mobs.length-1;i>=0;i--){var q=mobs[i],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;if(d<260){q.x+=dx/d*42*dt;q.y+=dy/d*42*dt}if(d<27){hp-=7*dt;if(hp<=0){hp=38;p.x=p.y=0;disc=0;lv=1;wp='Twig Sword';toast('💫 Bonked! Fresh start')}hud()}}for(var j=0;j<fx.length;j++)fx[j].t-=dt;fx=fx.filter(function(f){return f.t>0})}x.clearRect(0,0,w,h);var ts=48,cx=w/2,cy=h/2,stx=Math.floor((p.x-cx)/ts)-1,enx=Math.floor((p.x+cx)/ts)+1,sty=Math.floor((p.y-cy)/ts)-1,eny=Math.floor((p.y+cy)/ts)+1;for(var ty=sty;ty<=eny;ty++)for(var tx=stx;tx<=enx;tx++){var sx=tx*ts-p.x+cx,sy=ty*ts-p.y+cy,z=tile(tx,ty);x.fillStyle=((tx+ty)&1)?'#cfe8ad':'#c5df9f';x.fillRect(sx,sy,ts+1,ts+1);if(z==='water'){x.fillStyle='#9fd7e8';x.fillRect(sx,sy,ts+1,ts+1);x.fillStyle='#fff5';x.fillRect(sx+8,sy+16,20,2)}if(z==='tree'){x.fillStyle='#795d48';x.fillRect(sx+21,sy+25,6,17);x.fillStyle='#70a261';x.fillRect(sx+9,sy+7,30,25);x.fillStyle='#87bb74';x.fillRect(sx+15,sy+2,18,16)}if(z==='flower'){x.fillStyle='#6d9e62';x.fillRect(sx+23,sy+25,2,12);x.fillStyle='#ee9fc2';x.fillRect(sx+19,sy+19,10,8)}}for(var k=0;k<mobs.length;k++)drawMob(mobs[k],mobs[k].x-p.x+cx,mobs[k].y-p.y+cy,now/1000);x.fillStyle='#0003';x.beginPath();x.ellipse(cx,cy+15,12,5,0,0,6.28);x.fill();x.fillStyle='#fff0e5';x.fillRect(cx-9,cy-12,18,17);x.fillStyle='#efb0ca';x.fillRect(cx-11,cy+4,22,17);x.fillStyle='#543f45';x.fillRect(cx-8,cy-17,16,7);x.fillStyle='#333';x.fillRect(cx-5,cy-6,3,3);x.fillRect(cx+3,cy-6,3,3);for(var f=0;f<fx.length;f++){var a=fx[f];x.strokeStyle='#fff2c9';x.lineWidth=8;x.beginPath();x.arc(cx,cy,55,a.a-.8,a.a+.8);x.stroke()}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();</script></body></html>
