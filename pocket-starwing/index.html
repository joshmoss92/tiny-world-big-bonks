<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1022" />
  <title>Pocket Starwing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Pocket Starwing</h1>
      <div class="hud" aria-live="polite">
        <span aria-label="Score">★ <b id="score">0</b></span>
        <span aria-label="Hull"><b id="hull">♥♥♥♥♥♥</b></span>
        <span aria-label="Sector">◆ <b id="level">1</b></span>
        <span class="weapon-pill" aria-label="Weapon"><b id="weapon">Pulse Cannon ★</b></span>
        <span aria-label="Energy">⚡ <b id="energy">100%</b></span>
      </div>
    </header>

    <section class="play-stage">
      <div id="verticalControl" class="flight-pad" role="application" aria-label="Flight control. Drag up and down strongly, or left and right slightly.">
        <span class="pad-up">▲</span>
        <span class="pad-left">◀</span>
        <span class="pad-dot">●</span>
        <span class="pad-right">▶</span>
        <span class="pad-down">▼</span>
      </div>

      <section class="game-wrap">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Pocket Starwing game"></canvas>
        <div id="overlay" class="overlay">
          <div class="panel">
            <h2 id="overlayTitle">Pocket Starwing</h2>
            <p id="overlayText" class="overlay-copy"></p>
            <div id="routeChoice" class="route-choice hidden"></div>
            <button id="startBtn" class="play-button" aria-label="Start mission">▶</button>
          </div>
        </div>
      </section>
    </section>

    <section class="action-pad" aria-label="Action controls">
      <button id="fireBtn" class="fire" aria-label="Fire">●</button>
      <button id="dodgeBtn" class="dodge" aria-label="Dodge">↯</button>
      <button id="bombBtn" class="bomb" aria-label="Bomb">✦</button>
    </section>
  </main>
  <script src="movement-hotfix.js"></script>
  <script src="game.js"></script>
</body>
</html>
