<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1022" />
  <title>Pocket Starwing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Pocket Starwing</h1>
      <div class="hud" aria-live="polite">
        <span aria-label="Score">★ <b id="score">0</b></span>
        <span aria-label="Hull"><b id="hull">♥♥♥♥♥♥</b></span>
        <span aria-label="Sector">◆ <b id="level">1</b></span>
        <span class="weapon-pill" aria-label="Weapon"><b id="weapon">• Pulse ★</b></span>
      </div>
    </header>

    <section class="play-stage">
      <div id="flightPad" class="flight-pad" role="application" aria-label="Flight control pad. Drag in any direction to steer.">
        <span class="pad-axis pad-up">▲</span>
        <span class="pad-axis pad-left">◀</span>
        <span id="padPuck" class="pad-puck" aria-hidden="true"></span>
        <span class="pad-axis pad-right">▶</span>
        <span class="pad-axis pad-down">▼</span>
      </div>

      <section class="game-wrap">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Pocket Starwing game"></canvas>
        <div id="overlay" class="overlay">
          <div class="panel">
            <h2 id="overlayTitle">Pocket Starwing</h2>
            <p id="overlayText" class="overlay-copy"></p>
            <div id="routeChoice" class="route-choice hidden"></div>
            <button id="startBtn" class="play-button" aria-label="Start mission">▶</button>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="shooter.js"></script>
</body>
</html>
